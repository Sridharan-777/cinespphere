<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary, #e50914)" />
      <stop offset="50%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#2f3542" />
    </linearGradient>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a4b0be" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Sphere -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#sphereGrad)" stroke-width="4.5" filter="url(#glow)" />
  
  <!-- Film Orbit Ring -->
  <ellipse cx="50" cy="50" rx="46" ry="18" fill="none" stroke="var(--primary, #e50914)" stroke-width="2.5" stroke-dasharray="6,4" transform="rotate(-30 50 50)" opacity="0.85" />
  
  <!-- Center Film Reel Core -->
  <circle cx="50" cy="50" r="24" fill="#14141e" stroke="url(#reelGrad)" stroke-width="3" />
  
  <!-- Film Reel Perforations -->
  <circle cx="50" cy="36" r="4.5" fill="url(#sphereGrad)" />
  <circle cx="62" cy="43" r="4.5" fill="url(#sphereGrad)" />
  <circle cx="62" cy="57" r="4.5" fill="url(#sphereGrad)" />
  <circle cx="50" cy="64" r="4.5" fill="url(#sphereGrad)" />
  <circle cx="38" cy="57" r="4.5" fill="url(#sphereGrad)" />
  <circle cx="38" cy="43" r="4.5" fill="url(#sphereGrad)" />

  <!-- Center Projector Spindle & Play Symbol -->
  <circle cx="50" cy="50" r="8" fill="#0b0b0f" stroke="#ffffff" stroke-width="2" />
  <polygon points="48,46 55,50 48,54" fill="var(--primary, #e50914)" />
</svg>
