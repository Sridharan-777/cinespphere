{% extends "base.html" %}

{% block title %}Sign In — CineSphere{% endblock %}

{% block content %}
<div class="container">
    <div class="form-card" style="max-width: 480px; margin: 2rem auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 2.2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
        
        <div style="text-align: center; margin-bottom: 1.8rem;">
            <img src="/static/images/logo.svg" alt="Logo" style="width: 42px; height: 42px; margin-bottom: 0.5rem;">
            <h2 style="font-family: var(--font-heading); font-size: 1.8rem; margin: 0 0 0.3rem;">Customer Sign In</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin: 0;">
                Log in to reserve seats, redeem membership discounts, and view your tickets.
            </p>
        </div>



        <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">
            <div class="form-group" style="margin-bottom: 1.2rem;">
                <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Email Address</label>
                <input type="email" id="login-email" name="email" class="form-control" placeholder="customer1@cinesphere.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
                <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">
                Sign In with Email
            </button>

            <div style="display: flex; align-items: center; text-align: center; margin: 1rem 0;">
                <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--border);">
                <span style="padding: 0 10px; color: var(--text-muted); font-size: 0.85rem;">or</span>
                <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--border);">
            </div>

            <a href="{{ url_for('auth.google_login') }}" class="btn" style="width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 600; background: #ffffff; color: #333333; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="width: 20px; height: 20px;">
                Sign in with Google
            </a>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
            Need a new account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600;">Create One Here</a>
        </div>
    </div>
</div>


{% endblock %}
