{% extends "base.html" %}

{% block title %}My Profile — CineSphere{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="form-card" style="max-width: 100%;">
        <h1 style="font-size: 1.8rem; font-family: var(--font-heading); margin-bottom: 0.3rem;">Personal Profile</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.8rem;">Update your account contact details and security credentials.</p>

        <form action="{{ url_for('customer.profile') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ customer.name or user.name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address (Read-only)</label>
                <input type="email" class="form-control" value="{{ user.email }}" disabled style="opacity: 0.7;">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" value="{{ customer.phone or user.phone }}">
            </div>

            <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" value="{{ customer.city or '' }}" placeholder="e.g. Mumbai">
            </div>

            <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ customer.address or '' }}" placeholder="Street address">
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 1.2rem; margin-top: 1.5rem;">
                <h4 style="font-size: 1rem; margin-bottom: 0.8rem;">Change Password</h4>
                <div class="form-group">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="new_password" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
