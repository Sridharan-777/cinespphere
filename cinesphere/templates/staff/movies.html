{% extends "base.html" %}
{% block title %}Add Movies - Staff{% endblock %}
{% block content %}<div class="container">
<div class="section-header"><h1 class="section-title">Movie Catalog</h1></div>
<div class="form-card" style="padding:1.5rem;margin-bottom:2rem;"><h2>Add Movie and Poster</h2>
<form action="{{ url_for('staff.movies') }}" method="POST" enctype="multipart/form-data" class="crud-form-grid">
<input class="form-control" name="title" placeholder="Movie title" required><input class="form-control" name="language" value="English" required>
<input class="form-control" name="genres" placeholder="Genres, comma separated"><input class="form-control" name="director" placeholder="Director">
<input class="form-control" type="number" name="runtime" placeholder="Runtime"><input class="form-control" type="date" name="release_date">
<select class="form-control" name="status"><option>Now Showing</option><option>Coming Soon</option></select><input class="form-control" type="file" name="poster" accept="image/jpeg,image/png,image/webp" required>
<textarea class="form-control" name="overview" placeholder="Overview"></textarea><button class="btn btn-primary">Add Movie</button>
</form></div>
<div class="dashboard-grid">{% for m in movies %}<div class="stat-card"><img src="{{ m.poster_url }}" alt="{{ m.title }} poster" style="width:100%;max-height:260px;object-fit:cover;"><h3>{{ m.title }}</h3><p>{{ m.status }}</p></div>{% endfor %}</div>
</div>{% endblock %}
