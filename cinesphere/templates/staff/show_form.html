{% extends "base.html" %}

{% block title %}Schedule Show — Staff Portal{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="form-card" style="max-width: 100%;">
        <h1 style="font-size: 1.8rem; font-family: var(--font-heading); margin-bottom: 0.3rem;">Schedule Show</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.8rem;">
            Assign a movie to a screen. The system validates no overlapping schedules on the same screen.
        </p>

        <form action="{{ url_for('staff.show_create') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Movie</label>
                <select name="movie_id" class="form-control" required>
                    {% for m in movies %}
                    <option value="{{ m._id }}">{{ m.title }} ({{ m.runtime }}m)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Screen Auditorium</label>
                <select name="screen_id" class="form-control" required>
                    {% for s in screens %}
                    <option value="{{ s._id }}">{{ s.name }} — {{ s.screen_type }} ({{ s.capacity }} seats)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Show Date</label>
                <input type="date" name="show_date" class="form-control" value="2026-10-07" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Start Time</label>
                    <input type="time" name="start_time" class="form-control" value="18:30" required>
                </div>
                <div class="form-group">
                    <label class="form-label">End Time</label>
                    <input type="time" name="end_time" class="form-control" value="21:15" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Base Ticket Price (₹)</label>
                <input type="number" name="base_price" class="form-control" value="220" min="50" max="2000" required>
            </div>

            <div style="display: flex; gap: 0.8rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Showtime</button>
                <a href="{{ url_for('staff.shows_list') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
