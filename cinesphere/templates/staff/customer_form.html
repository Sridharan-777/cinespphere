{% extends "base.html" %}

{% block title %}Create Customer — Staff Portal{% endblock %}

{% block content %}
<div class="container" style="max-width: 580px;">
    <div class="form-card" style="max-width: 100%;">
        <h1 style="font-size: 1.8rem; font-family: var(--font-heading); margin-bottom: 0.3rem;">Register Customer</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.8rem;">Onboard a new cinema patron into CineSphere database.</p>

        <form action="{{ url_for('staff.customer_create') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Customer Name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="customer@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
            </div>

            <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" placeholder="Mumbai">
            </div>

            <div class="form-group">
                <label class="form-label">Temporary Password</label>
                <input type="password" name="password" class="form-control" value="Pass@1234" required>
                <small style="color: var(--text-muted);">Default: Pass@1234</small>
            </div>

            <div style="display: flex; gap: 0.8rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Customer</button>
                <a href="{{ url_for('staff.customers_list') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
