{% extends "base.html" %}

{% block title %}My Tasks — Worker Portal{% endblock %}

{% block content %}
<div class="container">
    <div class="section-header">
        <h1 class="section-title">All Assigned Field Tasks</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1rem;">
        {% for t in tasks %}
        <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.4rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="font-size: 1.15rem;">{{ t.title }}</h3>
                <span class="badge">{{ t.status }}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1rem;">{{ t.description }}</p>
            
            {% if t.status != 'Completed' %}
            <form action="{{ url_for('worker.update_task_status', task_id=t._id) }}" method="POST" style="display: flex; gap: 0.8rem;">
                <input type="text" name="notes" class="form-control" placeholder="Update progress..." value="{{ t.notes }}">
                <button type="submit" name="status" value="Completed" class="btn btn-sm btn-success">Mark Completed</button>
            </form>
            {% else %}
            <span style="color: var(--success); font-size: 0.85rem;">✓ Completed</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
