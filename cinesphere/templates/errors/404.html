{% extends "base.html" %}

{% block title %}Page Not Found (404) — CineSphere{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">🎞</div>
    <h1 style="font-size: 2.5rem; font-family: var(--font-heading); margin-bottom: 0.5rem; color: var(--accent);">404 — Scene Not Found</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem;">
        {{ message or "The requested movie, theater, or portal page does not exist in our cinema reel." }}
    </p>
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Back to Box Office</a>
</div>
{% endblock %}
